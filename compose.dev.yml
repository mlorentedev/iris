# iris dev substrate (per bootstrap-contract section 1). Motor runs natively via
# `air` for fast iteration; only NATS and the worker run in containers.
name: iris-dev

services:
  nats:
    image: nats:2.10-alpine
    # JetStream on; HTTP monitoring on :8222 backs the healthcheck. The client
    # port is published on host :4223 (NOT the default :4222) so it never clashes
    # with a kubelab NATS, per bootstrap-contract section 1.
    command: ["-js", "-m", "8222"]
    ports:
      - "4223:4222"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 1s

  worker-pi:
    # The real fleet worker (SDD-034d): a Go supervisor driving pi. It connects
    # to NATS, validates its container (container_validation), and subscribes to
    # team.<team>.worker.<name>, idling until a user_message arrives. It waits for
    # NATS to be healthy first.
    # Named image so a local `make worker-build` is reused by `up` instead of
    # rebuilt; on a fresh runner (CI) `up` builds it under this tag.
    image: iris-worker:dev
    build:
      context: .
      dockerfile: build/worker/Dockerfile
    environment:
      NATS_URL: nats://nats:4222
      TEAM: dev
      WORKER_NAME: worker-1
      # Inference provider env (pi-ai, OpenAI-compatible) rides through to pi at
      # job time. Left unset here: the substrate/smoke-test never runs a real job
      # (no tokens in CI); a real coding loop sets these. NEVER ANTHROPIC_API_KEY.
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      # Binary-present liveness; true readiness is the container_validation event.
      test: ["CMD", "worker", "--version"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 2s
