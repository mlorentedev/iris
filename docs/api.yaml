components:
  schemas:
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    HealthzOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/HealthzOutputBody.json
          format: uri
          readOnly: true
          type: string
        status:
          description: Liveness status
          examples:
            - ok
          type: string
      required:
        - status
      type: object
    ReadyzOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ReadyzOutputBody.json
          format: uri
          readOnly: true
          type: string
        db:
          description: Database readiness (ok|down)
          examples:
            - ok
          type: string
      required:
        - db
      type: object
info:
  title: iris motor
  version: 0.1.0-dev
openapi: 3.1.0
paths:
  /healthz:
    get:
      description: "Reports that the process is up and serving. Dependency-free: a liveness failure restarts the pod, which would never fix a downstream outage."
      operationId: get-healthz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthzOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Liveness probe
      tags:
        - ops
  /readyz:
    get:
      description: Reports 200 {"db":"ok"} while the database is reachable, else 503 {"db":"down"}. The "nats" key joins this body when the NATS client lands in SDD-034b.
      operationId: get-readyz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyzOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Readiness probe
      tags:
        - ops
