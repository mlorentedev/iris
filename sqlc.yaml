#
# sqlc codegen config (per ADR-002 + bootstrap-contract section 3: sqlc, NOT
# GORM, NOT AutoMigrate). Schema is read from the golang-migrate up files: sqlc
# recognizes the *.up.sql / *.down.sql naming and applies only the up files, so
# migrations remain the single source of schema truth (APPEND-ONLY).
#
# Keep every .sql file ASCII-only. sqlc miscomputes text offsets around
# multi-byte characters (e.g. an em-dash in a comment) and silently emits
# corrupted SQL constants with exit 0 — a non-ASCII guard lives in pre-commit.
version: "2"
sql:
  - engine: "sqlite"
    schema: "internal/db/migrations"
    queries: "internal/db/queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/db/sqlc"
        sql_package: "database/sql"
        emit_interface: true # Querier interface — lets handlers/tests depend on an abstraction
        emit_json_tags: true
        emit_empty_slices: true
