name: CI

# Built up across SDD-034 tasks. Task 1: pre-commit + golangci-lint + go mod verify.
# Task 2: go build/vet/test + full golangci-lint run. Later: sqlc/migrations (T3),
# smoke-test (T4), docker-build + OpenAPI drift (T5).
#
# Runner routing (ADR-030): self-hosted via vars.RUNNER_DOCKER when set, else
# ubuntu-latest. Fork PRs are ALWAYS forced to ubuntu-latest — a self-hosted
# runner has Docker-socket / LAN access, so untrusted fork code must never reach it.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
          && 'ubuntu-latest'
          || fromJSON(vars.RUNNER_DOCKER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: pre-commit/action@v3.0.1

  golangci-lint:
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
          && 'ubuntu-latest'
          || fromJSON(vars.RUNNER_DOCKER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install golangci-lint v2
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - name: Lint
        run: golangci-lint run ./...

  build-test:
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
          && 'ubuntu-latest'
          || fromJSON(vars.RUNNER_DOCKER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -cover ./...

  go-mod-verify:
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
          && 'ubuntu-latest'
          || fromJSON(vars.RUNNER_DOCKER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go mod verify

  # Task 3: the committed sqlc output must equal a fresh `sqlc generate` — guards
  # against hand-edited generated code and stale types after a query/schema change.
  sqlc-diff:
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
          && 'ubuntu-latest'
          || fromJSON(vars.RUNNER_DOCKER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: make sqlc-diff

  # Task 3: migrations must apply, reverse, and re-apply cleanly. The up→down→up
  # roundtrip proves the down file is a real inverse and that up is idempotent —
  # a guarantee the in-process unit tests (forward-only) don't make.
  migrations-test:
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
          && 'ubuntu-latest'
          || fromJSON(vars.RUNNER_DOCKER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: up -> down -> up roundtrip
        run: |
          make migrate-up
          make migrate-down
          make migrate-up
