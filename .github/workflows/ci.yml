name: CI

# Built up across SDD-034 tasks. Task 1: pre-commit + golangci-lint + go mod verify.
# Task 2: go build/vet/test + full golangci-lint run. Later: sqlc/migrations (T3),
# smoke-test (T4), docker-build + OpenAPI drift (T5).
#
# Runner routing (ADR-030): self-hosted via vars.RUNNER_DOCKER when set, else
# ubuntu-latest. Fork PRs are ALWAYS forced to ubuntu-latest — a self-hosted
# runner has Docker-socket / LAN access, so untrusted fork code must never reach it.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
          && 'ubuntu-latest'
          || fromJSON(vars.RUNNER_DOCKER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  golangci-lint:
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
          && 'ubuntu-latest'
          || fromJSON(vars.RUNNER_DOCKER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
      - name: Install golangci-lint v2
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - name: Lint
        run: golangci-lint run ./...

  build-test:
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
          && 'ubuntu-latest'
          || fromJSON(vars.RUNNER_DOCKER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -cover ./...

  go-mod-verify:
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
          && 'ubuntu-latest'
          || fromJSON(vars.RUNNER_DOCKER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
      - run: go mod verify

  # Task 3: the committed sqlc output must equal a fresh `sqlc generate` — guards
  # against hand-edited generated code and stale types after a query/schema change.
  sqlc-diff:
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
          && 'ubuntu-latest'
          || fromJSON(vars.RUNNER_DOCKER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
      # Provisions the pinned sqlc on PATH (Makefile uses `SQLC ?= sqlc`).
      # Keep sqlc-version in sync with SQLC_VERSION in the Makefile.
      - uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6 # v5
        with:
          sqlc-version: "1.31.1"
      - run: make sqlc-diff

  # Task 3: migrations must apply, reverse, and re-apply cleanly. The up→down→up
  # roundtrip proves the down file is a real inverse and that up is idempotent —
  # a guarantee the in-process unit tests (forward-only) don't make.
  migrations-test:
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
          && 'ubuntu-latest'
          || fromJSON(vars.RUNNER_DOCKER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
      - name: up -> down -> up roundtrip
        run: |
          make migrate-up
          make migrate-down
          make migrate-up

  # Task 4: the dev substrate (NATS + worker-pi-stub) plus the motor must pass
  # the 5-check smoke-test end to end. The motor runs directly here (air
  # hot-reload is a dev-only concern); the substrate and smoke-test script are
  # the same artifacts used locally.
  smoke-test:
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
          && 'ubuntu-latest'
          || fromJSON(vars.RUNNER_DOCKER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
      - name: Install pinned tools (nats CLI for the smoke checks)
        run: make install-tools
      - name: Bring up substrate
        run: docker compose -f compose.dev.yml up -d --wait
      - name: Start motor and run smoke-test
        run: |
          go build -o ./tmp/motor ./cmd/motor
          ./tmp/motor & MOTOR=$!
          for _ in $(seq 1 30); do curl -fsS localhost:8080/healthz >/dev/null 2>&1 && break; sleep 1; done
          make smoke-test
          kill "$MOTOR" 2>/dev/null || true
      - name: Teardown substrate
        if: always()
        run: docker compose -f compose.dev.yml down

  # Task 5: docs/api.yaml must equal a fresh `make api-docs` — keeps the
  # committed OpenAPI in lockstep with the huma routes.
  openapi-drift-check:
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
          && 'ubuntu-latest'
          || fromJSON(vars.RUNNER_DOCKER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
      - run: make api-docs-diff

  # Task 5: the production image must build (multi-stage, distroless, non-root).
  # v0 builds only -- no push (Docker Hub secrets are added post-merge); the
  # version triplet is asserted from the built binary.
  docker-build:
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
          && 'ubuntu-latest'
          || fromJSON(vars.RUNNER_DOCKER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Build image
        run: make docker-build
      - name: Assert version triplet is embedded
        # iris:dev matches the Makefile IMAGE_LOCAL default.
        run: |
          docker run --rm iris:dev /motor --version \
            | grep -qE '^iris 0\.1\.0-dev \(sha=[a-f0-9]{7,} built=[0-9-]{10}T'

  # SDD-034d: the fleet worker image must build (multi-stage Go -> Node + pinned
  # pi, per ADR-009 -- not distroless) and embed its version triplet.
  worker-docker-build:
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
          && 'ubuntu-latest'
          || fromJSON(vars.RUNNER_DOCKER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Build worker image
        run: make worker-build
      - name: Assert version triplet is embedded
        # iris-worker:dev matches the Makefile IMAGE_WORKER default; ENTRYPOINT is
        # the worker binary, so args are passed straight through.
        run: |
          docker run --rm iris-worker:dev --version \
            | grep -qE '^iris-worker 0\.1\.0-dev \(sha=[a-f0-9]{7,} built=[0-9-]{10}T'
